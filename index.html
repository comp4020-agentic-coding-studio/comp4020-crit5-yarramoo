<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lunge</title>
    <meta
      name="description"
      content="A side-view platformer: hold to freeze time and aim a lunge, release to dash -- it kills anything in its path but never slows down for it."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
      <h1>Lunge</h1>
    </header>
    <main>
      <canvas id="game" width="800" height="600" aria-label="Game view"></canvas>
      <a id="restart" href="#" hidden>Play again</a>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
